services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tp24-local}
      MYSQL_DATABASE: smart-house
      MYSQL_USER: smarthouse
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smarthouse-local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./Smart_Home_back
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart-house?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: smarthouse
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-smarthouse-local}

  frontend:
    build: ./smartHome-front
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
